<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Play6 News Fetch</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <h1>Simple News Fetch</h1>
  <p>Type a topic and click Load News.</p>

  <div class="controls">
    <input id="queryInput" type="text" value="technology" placeholder="Search topic">
    <button id="loadBtn" type="button">Load News</button>
  </div>

  <div id="status" class="status">Ready.</div>
  <div id="newsList"></div>

  <script src="./script.js"></script>
</body>
</html>
