<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Play5 - Async Fetch Demo</title>
  <style>
    :root {
      --bg1: #f8fafc;
      --bg2: #e2e8f0;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --accent: #0ea5e9;
      --accent-dark: #0284c7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background: linear-gradient(140deg, var(--bg1), var(--bg2));
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(760px, 100%);
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
      padding: 24px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.4rem, 3.2vw, 2rem);
    }

    .subtitle {
      margin: 0 0 18px;
      color: var(--muted);
    }

    .quote {
      background: #f1f5f9;
      border-left: 4px solid var(--accent);
      padding: 14px 16px;
      border-radius: 10px;
      min-height: 90px;
      margin-bottom: 16px;
    }

    .setup {
      margin: 0 0 8px;
      font-size: 1.05rem;
      line-height: 1.45;
    }

    .punchline {
      margin: 0;
      color: #1e293b;
      font-weight: 600;
      line-height: 1.45;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      background: var(--accent);
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.98rem;
      transition: background 0.15s ease-in-out;
    }

    button:hover {
      background: var(--accent-dark);
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .status {
      color: var(--muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Random Joke API</h1>
    <p class="subtitle">A super simple async fetch demo.</p>

    <section class="quote" aria-live="polite">
      <p id="setup" class="setup">Click the button to load a joke.</p>
      <p id="punchline" class="punchline"></p>
    </section>

    <div class="actions">
      <button id="loadBtn" type="button">Load Joke</button>
      <span id="status" class="status">Ready.</span>
    </div>
  </main>

  <script>
    'use strict';

    const loadBtn = document.querySelector('#loadBtn');
    const setupEl = document.querySelector('#setup');
    const punchlineEl = document.querySelector('#punchline');
    const statusEl = document.querySelector('#status');

    async function loadJoke() {
      loadBtn.disabled = true;
      statusEl.textContent = 'Loading...';
      setupEl.textContent = 'Fetching from API...';
      punchlineEl.textContent = '';

      try {
        const response = await fetch('https://official-joke-api.appspot.com/random_joke');
        if (!response.ok) {
          throw new Error('Request failed with status ' + response.status);
        }

        const data = await response.json();
        setupEl.textContent = data.setup;
        punchlineEl.textContent = data.punchline;
        statusEl.textContent = 'Loaded successfully.';
      } catch (error) {
        setupEl.textContent = 'Could not load a joke right now.';
        punchlineEl.textContent = 'Please try again.';
        statusEl.textContent = 'Error: ' + error.message;
      } finally {
        loadBtn.disabled = false;
      }
    }

    loadBtn.addEventListener('click', loadJoke);
  </script>
</body>
</html>
